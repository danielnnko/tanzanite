<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Mockup — Profile Dropdown Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --nav-bg: #ffffff;
    --page-bg: #f3f5fb;
    --border: #e5e8f0;
    --text: #1a1d27;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --accent: #3862e0;
    --card: #ffffff;
    --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.14), 0 2px 8px rgba(15, 23, 42, 0.08);
    --hover: #f4f6fb;
  }
  html[data-theme="dark"] {
    --nav-bg: #121a2e;
    --page-bg: #0a0e1a;
    --border: #25304d;
    --text: #eef1f8;
    --text-secondary: #a4adc6;
    --text-muted: #6b7691;
    --card: #182238;
    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
    --hover: #1f2b45;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--page-bg);
    color: var(--text);
    transition: background 150ms ease, color 150ms ease;
  }

  /* ── Top navigation header ─────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 60px;
    padding: 0 22px;
    background: var(--nav-bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .spacer { flex: 1; }

  /* Dark mode toggle */
  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 120ms, color 120ms;
  }
  .theme-toggle:hover { background: var(--hover); color: var(--text); }

  /* ── Profile trigger (avatar + name + chevron) ─────────── */
  .profile-trigger {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 5px 10px 5px 6px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    position: relative;
  }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  .avatar-fallback {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f7cff, #7aa2ff);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .username { font-size: 13px; font-weight: 500; color: var(--text); }
  .chevron { color: var(--text-muted); display: flex; transition: transform 150ms ease; }
  .profile-trigger.open .chevron { transform: rotate(180deg); }

  /* ── Dropdown card ─────────────────────────────────────── */
  .dropdown {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 264px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    padding: 8px;
    z-index: 200;
  }
  /* caret pointing at the avatar */
  .dropdown::before {
    content: '';
    position: absolute;
    top: -6px; right: 22px;
    width: 12px; height: 12px;
    background: var(--card);
    border-left: 1px solid var(--border);
    border-top: 1px solid var(--border);
    transform: rotate(45deg);
    border-top-left-radius: 3px;
  }

  .dd-header { padding: 10px 12px 12px; }
  .dd-name  { font-size: 14px; font-weight: 700; color: #374151; line-height: 1.35; }
  .dd-email { font-size: 12px; color: #9ca3af; line-height: 1.4; margin-top: 2px; }
  html[data-theme="dark"] .dd-name  { color: #eef1f8; }
  html[data-theme="dark"] .dd-email { color: #8b96b3; }

  .dd-menu { list-style: none; margin: 4px 0 0; padding: 0; }
  .dd-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 100ms, color 100ms;
  }
  .dd-item:hover { background: var(--hover); color: var(--text); }
  .dd-item svg { flex: 0 0 auto; color: var(--text-muted); }
  .dd-item:hover svg { color: var(--accent); }

  .dd-divider { border: 0; border-top: 1px solid var(--border); margin: 8px 6px; }
  .dd-item.danger:hover { background: rgba(239, 68, 68, 0.08); }
  .dd-item.danger:hover svg { color: #ef4444; }

  /* Demo-only hint */
  .hint {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--text-muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: var(--shadow-card);
  }
</style>
</head>
<body>

<!-- ══ Top Bar State ════════════════════════════════════════ -->
<header class="topbar">
    <span class="brand">GroundStation</span>
    <span class="spacer"></span>

    <!-- Dark mode toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <!-- Profile trigger: avatar + username + chevron (open state) -->
    <div class="profile-trigger open" id="trigger">
        <img class="avatar" alt="Asha Mwakalinga"
             src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f7cff'/%3E%3Cstop offset='1' stop-color='%237aa2ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='url(%23g)'/%3E%3Ctext x='32' y='41' font-family='Inter,sans-serif' font-size='26' font-weight='600' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
        <span class="username">amwakalinga</span>
        <span class="chevron">
            <!-- upward chevron = menu open -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
        </span>

        <!-- ══ Dropdown Card ═════════════════════════════════ -->
        <div class="dropdown" role="menu" aria-label="Profile menu">
            <!-- Header: full name + email -->
            <div class="dd-header">
                <div class="dd-name">Asha Mwakalinga</div>
                <div class="dd-email">asha.mwakalinga@tanzanitesat.io</div>
            </div>

            <!-- Menu options -->
            <ul class="dd-menu">
                <li class="dd-item" role="menuitem">
                    <!-- outline person icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Edit profile
                </li>
                <li class="dd-item" role="menuitem">
                    <!-- outline gear icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Account settings
                </li>
                <li class="dd-item" role="menuitem">
                    <!-- outline question-circle icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
                    Support
                </li>
            </ul>

            <!-- Divider + Sign out -->
            <hr class="dd-divider">
            <ul class="dd-menu" style="margin-top:0;">
                <li class="dd-item danger" role="menuitem">
                    <!-- outline log-out arrow icon -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                    Sign out
                </li>
            </ul>
        </div>
    </div>
</header>

<div class="hint">Static mockup · toggle works · dropdown shown open</div>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        document.getElementById('icon-moon').style.display = next === 'dark' ? '' : 'none';
        document.getElementById('icon-sun').style.display  = next === 'dark' ? 'none' : '';
    }
</script>
</body>
</html>
