<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANZANITESAT - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #121212; color: #ffffff;">
    <div class="login-card instrument-surface" style="padding: 2rem; border-radius: 8px; width: 100%; max-width: 400px; background-color: #1e1e1e;">
        <h1 class="logo" style="text-align: center; margin-bottom: 2rem; color: #4f7cff;">TANZANITESAT</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages" style="list-style: none; padding: 0; color: #ff4d6a;">
                {% for message in messages %}
                    <li style="margin-bottom: 1rem; text-align: center;">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username" style="display: block; margin-bottom: 0.5rem;">Username</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 0.5rem; background: #333; border: 1px solid #555; color: white;">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password" style="display: block; margin-bottom: 0.5rem;">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 0.5rem; background: #333; border: 1px solid #555; color: white;">
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; background: #4f7cff; color: white; border: none; cursor: pointer; border-radius: 4px;">Login</button>
        </form>
    </div>
</body>
</html>
