<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANZANITESAT - Login</title>
    <script>
        // Match the app shell: apply saved theme before first paint.
        (function () {
            try {
                document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
            } catch (e) { /* storage unavailable — keep default */ }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page" style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: var(--bg); color: var(--text); transition: background-color 150ms ease, color 150ms ease;">
    <div class="login-card instrument-surface" style="padding: 2rem; width: 100%; max-width: 400px;">
        <h1 class="logo" style="text-align: center; margin: 0 0 2rem; color: var(--accent); font-size: 1.5rem; letter-spacing: 0.04em;">TANZANITESAT</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages" style="list-style: none; padding: 0; color: var(--danger);">
                {% for message in messages %}
                    <li style="margin-bottom: 1rem; text-align: center; font-size: 12.5px;">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" autofocus class="form-control">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; border-radius: 7px;">Login</button>
        </form>
    </div>
</body>
</html>
