{% extends 'base.html' %}

{% block content %}
<div class="password-card instrument-surface" style="max-width: 500px; margin: 2rem auto; padding: 2rem; background: #1e1e1e; border-radius: 8px;">
    <h2>Change Password</h2>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flash-messages" style="list-style: none; padding: 0; color: #ff4d6a;">
            {% for message in messages %}
                <li style="margin-bottom: 1rem;">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <form action="/change-password" method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="current_password" style="display: block; margin-bottom: 0.5rem;">Current Password</label>
            <input type="password" id="current_password" name="current_password" required style="width: 100%; padding: 0.5rem; background: #333; border: 1px solid #555; color: white;">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="new_password" style="display: block; margin-bottom: 0.5rem;">New Password</label>
            <input type="password" id="new_password" name="new_password" required style="width: 100%; padding: 0.5rem; background: #333; border: 1px solid #555; color: white;">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="confirm_password" style="display: block; margin-bottom: 0.5rem;">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required style="width: 100%; padding: 0.5rem; background: #333; border: 1px solid #555; color: white;">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; background: #4f7cff; color: white; border: none; cursor: pointer; border-radius: 4px;">Change Password</button>
    </form>
</div>
{% endblock %}
