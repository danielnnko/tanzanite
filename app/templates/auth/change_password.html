{% extends 'base.html' %}

{% block content %}
<div class="password-card" style="max-width: 500px; margin: 2rem auto; padding: 2rem; background: var(--card); border: 1px solid var(--border); border-radius: 8px;">
    <h2>Account settings</h2>
    <p style="color: var(--text-secondary); font-size: 12.5px; margin-top: -0.5rem;">Change the password for your own account.</p>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flash-messages" style="list-style: none; padding: 0; color: var(--danger);">
            {% for message in messages %}
                <li style="margin-bottom: 1rem;">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <form action="/change-password" method="POST">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="current_password" style="display: block; margin-bottom: 0.5rem;">Current Password</label>
            <input type="password" id="current_password" name="current_password" required class="form-control" style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="new_password" style="display: block; margin-bottom: 0.5rem;">New Password</label>
            <input type="password" id="new_password" name="new_password" required class="form-control" style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="confirm_password" style="display: block; margin-bottom: 0.5rem;">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required class="form-control" style="width: 100%;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; border-radius: 7px;">Change Password</button>
    </form>
</div>
{% endblock %}
